spring:
  application:
    name: gatewayserver
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: configserver:http://${CONFIG_HOST:localhost}:8888
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/microservices-demo}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: profile-service
              uri: lb://profileservice
              predicates:
                - Path=/api/v1/profiles,/api/v1/profiles/**
            - id: post-service
              uri: lb://postservice
              predicates:
                - Path=/api/v1/posts,/api/v1/posts/**