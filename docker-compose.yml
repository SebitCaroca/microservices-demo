services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    command: start-dev
    ports:
      - "9090:8080"
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"

  configserver:
    profiles: [full]
    image: sebitcaroca/demomicro-configserver:latest
    ports:
      - "8888:8888"
    volumes:
      - ./config:/config
    environment:
      SPRING_PROFILES_ACTIVE: native,docker
      CONFIG_HOST: configserver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  eurekaserver:
    profiles: [full]
    image: sebitcaroca/demomicro-eurekaserver:latest
    ports:
      - "8761:8761"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_HOST: configserver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gatewayserver:
    profiles: [full]
    image: sebitcaroca/demomicro-gatewayserver:latest
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_HOST: configserver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

  profileservice:
    profiles: [full]
    image: sebitcaroca/demomicro-profileservice:latest
    depends_on:
      configserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_HOST: configserver
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

  postservice:
    profiles: [full]
    image: sebitcaroca/demomicro-postservice:latest
    depends_on:
      configserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_HOST: configserver
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

volumes:
  postgres_data:
