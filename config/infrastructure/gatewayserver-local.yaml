server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/microservices-demo
  cloud:
    gateway:
      routes:
        - id: profile-service
          uri: lb://profileservice
          predicates:
            - Path=/api/v1/profiles,/api/v1/profiles/**
        - id: post-service
          uri: lb://postservice
          predicates:
            - Path=/api/v1/posts,/api/v1/posts/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/