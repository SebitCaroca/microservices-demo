server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/microservices-demo # todo: replace with my own

  cloud:
    gateway:
      routes:
        - id: profile-service
          uri: lb://profileservice
          predicates:
            - Path=/api/profile/**
        - id: post-service
          uri: lb://postservice
          predicates:
            - Path=/api/posts/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/