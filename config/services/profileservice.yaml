server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/db_profile
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://host.docker.internal:9090/realms/microservices-demo

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/