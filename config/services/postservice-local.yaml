server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_post
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/microservices-demo

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/